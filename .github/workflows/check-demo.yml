name: Check Niu Lai demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the interface dependency
        run: python -m pip install -r requirements.txt
      - name: Confirm Streamlit testing is available
        run: python -c "from streamlit.testing.v1 import AppTest"
      - name: Check the workflow, exports, and Streamlit interface
        run: python -m unittest discover -s tests -v
